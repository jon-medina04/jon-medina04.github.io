baseURL = "https://example.org/"
languageCode = "es"
title = "Mi Portafolio"
theme = "careercanvas"

# Multilingual configuration
defaultContentLanguage = "es"
[languages]
  [languages.es]
    languageName = "Español"
    languageCode = "es"
    weight = 1

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2

[params]
  name = "Jon Medina Jaureguizar"
  tagline = "Especialista en IA y Big Data"
  hero_location = "Bilbao, Basque Country"
  email = "jon.medina04@somo.eus"
  description = "Técnico Superior en Desarrollo de Aplicaciones Multiplataforma especializado en Inteligencia Artificial y Big Data. Combino desarrollo de software, análisis de datos y aprendizaje automático para construir soluciones inteligentes y escalables."
  profile_image = "/images/jon.jpg"
  # Imagen de fondo estática para el héroe (pon aquí tu imagen)
  hero_background_image = "/images/space_back1.jpeg"
  # Etiquetas para colaboración (se usan en contacto)
  collab_tags = ["Proyectos IA", "Automatización", "Chatbots", "Dashboards", "MLOps"]
  # Endpoint opcional de Formspree u otro servicio
  formspree_endpoint = ""
  
  # Resume/CV
  resume_url_en = "/files/CV_Jon_MEdina_Jaureguizar.pdf"
  resume_label = "CV completo"

  # Colores estáticos del tema (desactiva el sistema dinámico)
  [params.colors]
    enabled = false  # Desactiva el sistema de colores dinámicos
    static_palette = "professional"  # Usa solo esta paleta
    main_color = "#474A51"     # Graphite Gray
    second_color = "#E52521"   # Mario Red
    third_color = "#3CB043"    # Luigi Green

  [params.pexels]
    enabled = true
    [params.pexels.queries]
      backgrounds = [
        "nature",
        "landscape",
        "technology",
        "abstract",
        "code"
      ]

# redes sociales (CORRECTO para este tema)
[[params.social]]
  name = "GitHub"
  url = "https://github.com/tuusuario"
  icon = "github"

[[params.social]]
  name = "LinkedIn"
